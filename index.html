<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crookflix — Home Theatre Showtimes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loading">
  <div class="load-text">Initializing Crookflix...</div>
  <div class="load-bar"><div class="load-bar-inner"></div></div>
</div>

<!-- PROGRESS BAR -->
<div id="progress-bar"></div>

<!-- NAVIGATION -->
<nav>
  <div class="nav-logo">CROOK<span>FLIX</span></div>
  <div class="nav-links">
    <a href="#upcoming">Upcoming</a>
    <a href="#archive">Archive</a>
  </div>
</nav>

<!-- HERO -->
<header class="hero" id="hero">
  <div class="hero-pixels" id="hero-pixels"></div>
  <h1 class="hero-title">
    <span class="glitch" data-text="CROOK">CROOK</span>
    <span class="glitch" data-text="FLIX" style="color:var(--accent-2)">FLIX</span>
  </h1>
  <p class="hero-sub" id="hero-sub">
    <span id="typed-text"></span><span class="cursor"></span>
  </p>
  <div class="scroll-indicator">▼ SCROLL TO EXPLORE ▼</div>
</header>

<!-- MARQUEE -->
<div class="marquee-wrap">
  <div class="marquee" id="marquee"></div>
</div>

<!-- UPCOMING (EVENTS + COLLECTIONS) -->
<section class="section" id="upcoming">
  <div class="section-header reveal">
    <span class="section-label">// NOW & NEXT</span>
    <h2 class="section-title">Upcoming <span class="highlight">Screenings</span></h2>
  </div>
  <div class="events-grid" id="events-grid"></div>
  <div class="empty-state" id="events-empty" style="display:none">
    <div class="empty-icon">▓▓</div>
    <p>No upcoming events. Check back soon.</p>
  </div>
</section>

<!-- ARCHIVE -->
<section class="section archive-section" id="archive">
  <div class="section-header reveal">
    <span class="section-label">// PAST SCREENINGS</span>
    <h2 class="section-title">The <span class="highlight">Archive</span></h2>
  </div>
  <div class="archive-list" id="archive-list"></div>
  <div class="empty-state" id="archive-empty" style="display:none">
    <div class="empty-icon">░░</div>
    <p>Nothing archived yet.</p>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">CROOKFLIX</div>
  <p class="footer-text">Home Theatre Showtimes — Est. 2022</p>
  <div class="pixel-row" id="footer-pixels"></div>
</footer>

<!-- VIDEO MODAL -->
<div class="modal-overlay" id="video-modal">
  <div class="modal-box">
    <div class="modal-close" id="modal-close">✕ CLOSE</div>
    <iframe id="modal-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</div>

<!-- DATA SOURCE — Home page data lives in: data/home.js -->
<script src="data/home.js"></script>

<script src="./app.js"></script>
</body>
</html>
